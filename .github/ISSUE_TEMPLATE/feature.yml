name: Feature request
description: Propose a bounded product capability
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without prescribing architecture.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and current behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, privacy, i18n, accessibility, and scope boundaries
    validations:
      required: true
